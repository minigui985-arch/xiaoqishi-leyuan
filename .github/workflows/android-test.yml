name: Android test APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'pwa.js'
      - 'build-edgeone.cjs'
      - '小骑士乐园-统一主题版.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --prefix mobile
      - run: npm run sync:android --prefix mobile && npm run sync:ios --prefix mobile && npm run check:native --prefix mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoqishi-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
